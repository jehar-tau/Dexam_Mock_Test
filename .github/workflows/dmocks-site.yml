name: Publish dmocks.com

# Builds the public frontend from main after "DesignMocks checks" passes on a
# push to main, and publishes it on GitHub Pages at dmocks.com. To publish by
# hand, or to roll back, run this workflow with an older main commit as "ref".
on:
  workflow_run:
    workflows: ["DesignMocks checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to publish (an older main commit rolls back)
        default: main

permissions:
  contents: read

concurrency:
  group: dmocks-site
  cancel-in-progress: false

jobs:
  build:
    # Off until the owner sets the repository variable DMOCKS_PAGES_ENABLED=true (docs/HOSTING.md).
    if: >-
      vars.DMOCKS_PAGES_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/designmocks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false
      # Build tooling comes from this workflow's own commit, so a rollback can
      # rebuild a main commit made before the tooling existed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .site-tools
          sparse-checkout: apps/designmocks/scripts
          persist-credentials: false
      - name: Use the current build tooling
        run: |
          cp "$GITHUB_WORKSPACE/.site-tools/apps/designmocks/scripts/build-public-site.mjs" scripts/
          cp "$GITHUB_WORKSPACE/.site-tools/apps/designmocks/scripts/check-live-site.mjs" scripts/
          rm -rf "$GITHUB_WORKSPACE/.site-tools"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/designmocks/package-lock.json
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: asset-history
          key: dmocks-site-assets-${{ github.run_id }}
          restore-keys: dmocks-site-assets-
      - name: Build the public site
        env:
          DMOCKS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DMOCKS_SUPABASE_PUBLISHABLE_KEY }}
          DMOCKS_PUBLISHED_NOTICES_JSON: ${{ secrets.DMOCKS_PUBLISHED_NOTICES_JSON }}
          DMOCKS_RELEASED_STUDENT_MODULES: ${{ vars.DMOCKS_RELEASED_STUDENT_MODULES || 'practice' }}
        run: node scripts/build-public-site.mjs --cname dmocks.com --keep-assets "$GITHUB_WORKSPACE/asset-history"
      - run: printf 'Publishing commit %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/designmocks/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  live-check:
    needs: deploy
    if: vars.DMOCKS_PAGES_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node apps/designmocks/scripts/check-live-site.mjs https://dmocks.com
