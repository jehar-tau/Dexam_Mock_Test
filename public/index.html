<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 350px;
            background: #fff;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-bottom: 2px solid #3498db;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            font-size: 12px;
        }

        .stat {
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 4px;
        }

        .stat-value {
            font-weight: bold;
            font-size: 14px;
        }

        .filters {
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #666;
            text-transform: uppercase;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
        }

        .filter-group input {
            font-size: 13px;
        }

        .questions-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .question-item {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid #ddd;
        }

        .question-item:hover {
            background: #f9f9f9;
            border-color: #3498db;
            border-left-color: #3498db;
        }

        .question-item.active {
            background: #e3f2fd;
            border-color: #2196f3;
            border-left-color: #2196f3;
        }

        .question-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 6px;
        }

        .question-id {
            font-weight: 600;
            font-size: 12px;
            color: #2196f3;
        }

        .question-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 11px;
            padding: 2px 6px;
            background: #f0f0f0;
            border-radius: 3px;
            color: #666;
        }

        .tag.exam {
            background: #e3f2fd;
            color: #1976d2;
        }

        .tag.type {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .tag.status {
            background: #e8f5e9;
            color: #388e3c;
        }

        .question-preview {
            font-size: 12px;
            color: #666;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .question-detail {
            flex: 1;
            background: #fff;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .detail-header {
            background: #f9f9f9;
            border-bottom: 1px solid #ddd;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .detail-title {
            font-size: 18px;
            font-weight: 600;
        }

        .detail-meta {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .detail-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #f0f0f0;
            border-color: #999;
        }

        .btn.primary {
            background: #2196f3;
            color: white;
            border-color: #2196f3;
        }

        .btn.primary:hover {
            background: #1976d2;
        }

        .btn.secondary {
            background: #ff9800;
            color: white;
            border-color: #ff9800;
        }

        .btn.secondary:hover {
            background: #f57c00;
        }

        .btn.success {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .detail-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2c3e50;
            text-transform: uppercase;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
        }

        .question-text {
            font-size: 14px;
            line-height: 1.6;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 3px solid #2196f3;
        }

        .figure-viewer {
            margin-bottom: 15px;
        }

        .figure-image {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #f9f9f9;
        }

        .figure-error {
            background: #ffeaea;
            padding: 10px;
            border-radius: 4px;
            color: #d32f2f;
            font-size: 12px;
        }

        .options {
            margin-bottom: 15px;
        }

        .option {
            background: #f9f9f9;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 3px solid #9e9e9e;
            font-size: 13px;
        }

        .option.empty {
            color: #999;
            font-style: italic;
        }

        .answer-key {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #4caf50;
            margin-bottom: 15px;
        }

        .answer-key-label {
            font-size: 12px;
            color: #388e3c;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .answer-key-value {
            font-size: 16px;
            font-weight: bold;
            color: #2e7d32;
        }

        .review-section {
            background: #fff9c4;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #fbc02d;
        }

        .review-checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }

        .review-checkbox input {
            cursor: pointer;
        }

        .review-checkbox label {
            cursor: pointer;
            font-size: 13px;
            flex: 1;
        }

        .review-notes {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            min-height: 60px;
        }

        .comparison {
            background: #eceff1;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #00838f;
            font-size: 12px;
        }

        .comparison-status {
            margin-bottom: 8px;
            padding: 8px;
            background: white;
            border-radius: 3px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .pagination {
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 5px 10px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
        }

        .pagination button:hover {
            background: #f0f0f0;
        }

        .pagination button.active {
            background: #2196f3;
            color: white;
            border-color: #2196f3;
        }

        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 40%;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }

            .main {
                height: 60%;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Exam Mode Styles */
        .mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            gap: 10px;
            display: flex;
        }

        .mode-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }

        .exam-section {
            display: none;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .exam-section.active {
            display: block;
        }

        .exam-answer-area {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .keypad-input {
            text-align: center;
            margin-bottom: 15px;
        }

        .keypad-display {
            font-size: 32px;
            font-weight: bold;
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            min-height: 60px;
            color: #333;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 300px;
            margin: 0 auto;
        }

        .keypad-btn {
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .keypad-btn:hover {
            background: #f0f0f0;
        }

        .keypad-btn.delete {
            grid-column: span 1;
            background: #ff6b6b;
            color: white;
        }

        .keypad-btn.clear {
            grid-column: span 2;
            background: #ffa500;
            color: white;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 15px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-weight: 500;
        }

        .option-btn:hover {
            border-color: #3498db;
            background: #f0f8ff;
        }

        .option-btn.selected {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }

        .option-btn.msq {
            padding-left: 40px;
            position: relative;
        }

        .option-btn.msq::before {
            content: '☐';
            position: absolute;
            left: 15px;
            font-size: 20px;
        }

        .option-btn.msq.selected::before {
            content: '☑';
            color: white;
        }

        .drawing-canvas {
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            display: block;
            margin-bottom: 10px;
            cursor: crosshair;
        }

        .canvas-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .canvas-buttons button {
            padding: 10px 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .canvas-buttons button:hover {
            background: #f0f0f0;
        }

        .answer-box {
            background: #f0f9ff;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }

        .answer-label {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .answer-key-display {
            font-size: 18px;
            color: #27ae60;
            font-weight: bold;
            background: #e8f5e9;
            padding: 10px 15px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 10px;
        }

        .review-decision {
            margin-top: 20px;
            padding: 15px;
            background: #fff9e6;
            border-radius: 8px;
            border: 2px solid #ffc107;
        }

        .review-decision label {
            display: inline-flex;
            align-items: center;
            margin-right: 20px;
            cursor: pointer;
        }

        .review-decision input {
            margin-right: 8px;
        }

        .textarea-input {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h1>📊 Question Bank</h1>
                <div class="stats" id="stats"></div>
                <div style="background: rgba(255,255,255,0.1); padding: 12px; border-radius: 4px; margin-top: 12px; font-size: 11px;">
                    <div style="margin-bottom: 8px; font-weight: bold; color: #fff;">Review Progress:</div>
                    <div id="reviewStats" style="color: #e0e0e0;">Loading...</div>
                    <div style="margin-top: 10px; display: flex; gap: 6px; align-items: center;">
                        <select id="sessionSelect" style="flex: 1; padding: 4px; font-size: 11px;"></select>
                        <button onclick="newSession()" style="padding: 4px 8px; font-size: 11px; cursor: pointer;">+ Session</button>
                    </div>
                    <div style="margin-top: 8px; display: flex; gap: 6px;">
                        <button onclick="saveProgress()" style="flex: 1; padding: 6px; font-size: 11px; cursor: pointer; background: #27ae60; color: #fff; border: 0; border-radius: 3px;">💾 Save Progress</button>
                        <a href="/api/review-export" style="flex: 1; padding: 6px; font-size: 11px; text-align: center; background: #3498db; color: #fff; border-radius: 3px; text-decoration: none;">⬇ Export</a>
                    </div>
                    <div id="saveMsg" style="margin-top: 6px; color: #9be29b;"></div>
                </div>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label>Exam</label>
                    <select id="examFilter">
                        <option value="all">All Exams</option>
                        <option value="UCEED">UCEED</option>
                        <option value="NIFT">NIFT</option>
                        <option value="NID">NID</option>
                        <option value="CEED">CEED</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Type</label>
                    <select id="typeFilter">
                        <option value="all">All Types</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Status</label>
                    <select id="statusFilter">
                        <option value="all">All Statuses</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Review</label>
                    <select id="reviewFilter">
                        <option value="pending">To review (hide reviewed)</option>
                        <option value="all">All questions</option>
                        <option value="reviewed">Reviewed only</option>
                        <option value="flagged">Flagged only</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Search</label>
                    <input type="text" id="searchInput" placeholder="Search questions...">
                </div>
            </div>

            <div class="questions-list">
                <div class="loading" id="questionsList">Loading questions...</div>
            </div>

            <div class="pagination" id="pagination"></div>
        </div>

        <div class="main">
            <div class="question-detail">
                <div class="empty-state" id="detailView">
                    Select a question to view details
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentPage = 1;
        let currentFilters = { exam: 'all', type: 'all', status: 'all', search: '', review: 'pending' };
        let reviewSession = (() => { try { return localStorage.getItem('reviewSession') || ''; } catch (e) { return ''; } })() || ('Session ' + new Date().toISOString().slice(0, 10));
        let currentQuestion = null;
        let allQuestions = [];
        let currentTotalPages = 1;
        let viewMode = 'review'; // 'review' or 'exam'
        let studentAnswer = null; // Store student's exam answer
        let studentMarking = null; // Store if student marked correct/incorrect

        const keyLabel = (k) => /^[1-4]$/.test(String(k)) ? `${k} (= option ${'ABCD'[k-1]})` : k;
        const optText = (o) => (o && typeof o === 'object') ? o.text : o;

        // Update review statistics (whole bank, from server)
        async function updateReviewStats() {
            try {
                const st = await (await fetch(`${API_BASE}/review-stats`)).json();
                document.getElementById('reviewStats').innerHTML = `
                    <div>✓ Reviewed: <strong>${st.reviewed}</strong> | ⚠ Flagged: <strong>${st.flagged}</strong></div>
                    <div style="margin-top: 5px;">Remaining: <strong>${st.remaining}</strong> of ${st.total} (<strong>${st.remainingPercent}%</strong>)</div>`;
                const sel = document.getElementById('sessionSelect');
                const names = new Set(Object.keys(st.sessions));
                names.add(reviewSession);
                sel.innerHTML = [...names].map(n => `<option value="${n.replace(/"/g, '&quot;')}" ${n === reviewSession ? 'selected' : ''}>${n} (${st.sessions[n] || 0})</option>`).join('');
            } catch (err) {
                console.error('Error loading review stats:', err);
            }
        }

        function newSession() {
            const name = prompt('Name for the new review session:', 'Session ' + new Date().toLocaleString());
            if (!name) return;
            reviewSession = name;
            try { localStorage.setItem('reviewSession', name); } catch (e) {}
            updateReviewStats();
        }

        document.getElementById('sessionSelect').addEventListener('change', (e) => {
            reviewSession = e.target.value.replace(/ \(\d+\)$/, '');
            try { localStorage.setItem('reviewSession', reviewSession); } catch (e2) {}
        });

        async function saveProgress() {
            const msg = document.getElementById('saveMsg');
            try {
                const r = await (await fetch(`${API_BASE}/review-save`, { method: 'POST' })).json();
                msg.textContent = `Saved ${r.count} reviews → ${r.file}`;
            } catch (err) {
                msg.textContent = 'Save failed';
            }
        }

        // Initialize
        async function init() {
            await loadSummary();
            await loadQuestions();
        }

        // Load summary and populate filters
        async function loadSummary() {
            try {
                const res = await fetch(`${API_BASE}/summary`);
                const summary = await res.json();

                // Populate stats
                const statsHtml = `
                    <div class="stat"><div>Total</div><div class="stat-value">${summary.total_questions}</div></div>
                    <div class="stat"><div>UCEED</div><div class="stat-value">${summary.exams.UCEED}</div></div>
                    <div class="stat"><div>NIFT</div><div class="stat-value">${summary.exams.NIFT}</div></div>
                    <div class="stat"><div>NID</div><div class="stat-value">${summary.exams.NID}</div></div>
                `;
                document.getElementById('stats').innerHTML = statsHtml;

                // Populate type filter
                const typeSelect = document.getElementById('typeFilter');
                Object.keys(summary.types).sort().forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = `${type} (${summary.types[type]})`;
                    typeSelect.appendChild(option);
                });

                // Populate status filter
                const statusSelect = document.getElementById('statusFilter');
                Object.keys(summary.statuses).sort().forEach(status => {
                    const option = document.createElement('option');
                    option.value = status;
                    option.textContent = `${status} (${summary.statuses[status]})`;
                    statusSelect.appendChild(option);
                });
            } catch (err) {
                console.error('Error loading summary:', err);
            }
        }

        // Load questions with current filters
        async function loadQuestions() {
            try {
                const params = new URLSearchParams({
                    exam: currentFilters.exam,
                    type: currentFilters.type,
                    status: currentFilters.status,
                    search: currentFilters.search,
                    review: currentFilters.review,
                    page: currentPage,
                    limit: 50
                });

                const res = await fetch(`${API_BASE}/questions?${params}`);
                const data = await res.json();
                allQuestions = data.data;

                renderQuestionsList(data);
                renderPagination(data);
                updateReviewStats();
            } catch (err) {
                console.error('Error loading questions:', err);
                document.getElementById('questionsList').innerHTML = '<div class="error">Error loading questions</div>';
            }
        }

        // Render questions list
        function renderQuestionsList(data) {
            const container = document.getElementById('questionsList');

            if (data.data.length === 0) {
                container.innerHTML = '<div class="empty-state">No questions found</div>';
                return;
            }

            container.innerHTML = data.data.map(q => `
                <div class="question-item" onclick="selectQuestion('${q.id}')">
                    <div class="question-item-header">
                        <div class="question-id">${q.id}</div>
                        <div class="question-tags">
                            <span class="tag exam">${q.exam}</span>
                            <span class="tag type">${q.type}</span>
                        </div>
                    </div>
                    <div class="question-preview">${q.question_text.substring(0, 100)}...</div>
                </div>
            `).join('');
        }

        // Render pagination
        function renderPagination(data) {
            currentTotalPages = data.totalPages;
            const container = document.getElementById('pagination');
            const pages = [];

            for (let i = 1; i <= data.totalPages; i++) {
                if (i === 1 || i === data.totalPages || (i >= data.page - 2 && i <= data.page + 2)) {
                    pages.push(i);
                }
            }

            const html = pages.map(p => `
                <button class="${p === data.page ? 'active' : ''}" onclick="goToPage(${p})">
                    ${p}
                </button>
            `).join('');

            container.innerHTML = html;
        }

        // Select and display question
        async function selectQuestion(id) {
            try {
                const res = await fetch(`${API_BASE}/questions/${id}`);
                const question = await res.json();
                currentQuestion = question;

                // Mark as selected
                document.querySelectorAll('.question-item').forEach((item, i) => {
                    item.classList.toggle('active', allQuestions[i]?.id === id);
                });

                displayQuestion(question);
            } catch (err) {
                console.error('Error loading question:', err);
            }
        }

        // Display question details
        async function displayQuestion(q) {
            const figureHtml = q.figure_image
                ? `<div class="figure-viewer">
                     <img src="/${q.figure_image}" alt="Question figure" class="figure-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22400%22 height=%22300%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2216%22%3EImage not found%3C/text%3E%3C/text%3E%3C/svg%3E'">
                   </div>`
                : '';

            const optionsHtml = q.options.length > 0
                ? q.options.map((opt, i) => `<div class="option">${String.fromCharCode(65 + i)}. ${optText(opt)}</div>`).join('')
                : '<div class="option empty">No options (Numerical Answer Type)</div>';

            const comparisonRes = await fetch(`${API_BASE}/compare/${q.id}`);
            const comparison = await comparisonRes.json();

            const html = `
                <div class="detail-header">
                    <div>
                        <div class="detail-title">${q.question_no}. ${q.question_text.substring(0, 80)}</div>
                        <div class="detail-meta">
                            Question ID: ${q.id} | ${q.exam} ${q.paper_id} | Type: ${q.type}
                        </div>
                    </div>
                    <div class="detail-actions">
                        <button class="btn primary" id="markBtn" onclick="markForReviewAndNext()">✓ Mark & Next</button>
                        <button class="btn secondary" id="flagBtn" onclick="flagIssueAndNext()">⚠ Flag & Next</button>
                    </div>
                </div>

                <div class="detail-content">
                    <div class="section">
                        <div class="section-title">Question</div>
                        ${q.context_text ? `<div class="question-text" style="background:#fff8e1;border-left-color:#f39c12;margin-bottom:8px;"><em>Directions (read from the page, may be imperfect):</em> ${q.context_text}</div>` : ''}
                        <div class="question-text">${q.question_text}</div>
                    </div>

                    ${figureHtml ? `<div class="section"><div class="section-title">Figure</div>${figureHtml}</div>` : ''}

                    <div class="section">
                        <div class="section-title">Options${q.options_source === 'ocr' ? ' <span style="font-size:11px;color:#e67e22;text-transform:none;">(machine-read from the question image, verify)</span>' : ''}</div>
                        <div class="options">${optionsHtml}</div>
                    </div>

                    <div class="section">
                        <div class="section-title">Answer</div>
                        <div class="answer-key">
                            <div class="answer-key-label">Answer Key (${q.answer_status})</div>
                            <div class="answer-key-value">${keyLabel(q.answer_key)}</div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">Comparison</div>
                        <div class="comparison">
                            <div class="comparison-status">
                                🔍 Machine Readable Bank: ✓ Present
                            </div>
                            <div class="comparison-status">
                                🔍 Generic Bank: ${comparison.inGenericBank ? '✓ Found' : '✗ Not Found'}
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">Review & Notes</div>
                        <div class="review-section">
                            <div class="review-checkbox">
                                <input type="checkbox" id="markedCheckbox" onchange="updateReviewState()">
                                <label for="markedCheckbox">Mark for detailed review</label>
                            </div>
                            <div class="review-checkbox">
                                <input type="checkbox" id="flaggedCheckbox" onchange="updateReviewState()">
                                <label for="flaggedCheckbox">Flag issue found</label>
                            </div>
                            <textarea class="review-notes" id="notesTextarea" placeholder="Add notes about this question..." onchange="updateReviewState()"></textarea>
                            <button class="btn success" style="margin-top: 8px; width: 100%;" onclick="saveReviewState()">Save Notes</button>
                        </div>
                    </div>
                </div>
            `;

            // Reset studentAnswer and studentMarking for new question
            studentAnswer = null;
            studentMarking = null;

            // Wrap review content in review mode section
            const wrappedHtml = `
                <div style="position: relative;">
                    <div id="modeToggleContainer" style="display: flex; gap: 10px; margin-bottom: 20px; justify-content: center;">
                        <button id="reviewModeBtn" class="mode-btn active" onclick="toggleViewMode('review')">📋 Review Mode</button>
                        <button id="examModeBtn" class="mode-btn" onclick="toggleViewMode('exam')">📝 Exam Mode</button>
                    </div>

                    <div id="reviewMode">
                        ${html}
                    </div>

                    <div id="examMode" style="display: none;">
                        ${renderExamMode(q)}
                    </div>
                </div>
            `;

            document.querySelector('.question-detail').innerHTML = wrappedHtml;

            // Check if question is already marked or flagged and update button states
            const isMarked = q.reviewState?.marked || false;
            const isFlagged = q.reviewState?.flagged || false;

            const markBtn = document.getElementById('markBtn');
            const flagBtn = document.getElementById('flagBtn');

            if (markBtn) {
                if (isMarked) {
                    markBtn.textContent = '✓ Reviewed';
                    markBtn.disabled = true;
                    markBtn.style.opacity = '0.6';
                } else {
                    markBtn.textContent = '✓ Mark & Next';
                    markBtn.disabled = false;
                    markBtn.style.opacity = '1';
                }
            }
            if (flagBtn) {
                if (isFlagged) {
                    flagBtn.textContent = '⚠ Flagged';
                    flagBtn.disabled = true;
                    flagBtn.style.opacity = '0.6';
                } else {
                    flagBtn.textContent = '⚠ Flag & Next';
                    flagBtn.disabled = false;
                    flagBtn.style.opacity = '1';
                }
            }

            // Load saved state
            if (q.reviewState) {
                document.getElementById('markedCheckbox').checked = q.reviewState.marked;
                document.getElementById('flaggedCheckbox').checked = q.reviewState.flagged;
                document.getElementById('notesTextarea').value = q.reviewState.notes;
            }
        }

        async function updateReviewState() {
            const marked = document.getElementById('markedCheckbox').checked;
            const flagged = document.getElementById('flaggedCheckbox').checked;
            const notes = document.getElementById('notesTextarea').value;

            try {
                await fetch(`${API_BASE}/questions/${currentQuestion.id}/mark`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ marked, flagged, notes, session: reviewSession })
                });
            } catch (err) {
                console.error('Error updating review state:', err);
            }
        }

        async function markForReviewAndNext() {
            document.getElementById('markedCheckbox').checked = true;
            await finishReview();
        }

        async function flagIssueAndNext() {
            document.getElementById('flaggedCheckbox').checked = true;
            await finishReview();
        }

        // Save to server first, then advance; reviewed questions drop out of the "To review" list
        async function finishReview() {
            document.getElementById('markBtn')?.setAttribute('disabled', true);
            document.getElementById('flagBtn')?.setAttribute('disabled', true);
            await updateReviewState();

            const hide = currentFilters.review === 'pending';
            const idx = allQuestions.findIndex(q => q.id === currentQuestion.id);
            const next = allQuestions[idx + 1];

            await updateReviewStats();
            await loadQuestions();

            let target = null;
            if (hide) {
                target = next && allQuestions.find(q => q.id === next.id) ? next : allQuestions[0];
            } else {
                target = next || null;
            }
            if (target) {
                selectQuestion(target.id);
            } else {
                alert('✓ Nothing left in this list!');
            }
        }

        async function saveReviewState() {
            await updateReviewState();
            alert('✓ Notes saved! Click "Mark & Next" to continue reviewing');
        }

        // Pagination
        function goToPage(page) {
            currentPage = page;
            loadQuestions();
            document.querySelector('.questions-list').scrollTop = 0;
        }

        // Exam Mode Functions
        function toggleViewMode(mode) {
            viewMode = mode;
            const reviewSection = document.getElementById('reviewMode');
            const examSection = document.getElementById('examMode');
            const modeToggleContainer = document.getElementById('modeToggleContainer');

            if (mode === 'review') {
                reviewSection.style.display = 'block';
                examSection.style.display = 'none';
                // Show both buttons in review mode
                if (modeToggleContainer) {
                    modeToggleContainer.innerHTML = `
                        <button id="reviewModeBtn" class="mode-btn active" onclick="toggleViewMode('review')">📋 Review Mode</button>
                        <button id="examModeBtn" class="mode-btn" onclick="toggleViewMode('exam')">📝 Exam Mode</button>
                    `;
                }
            } else {
                reviewSection.style.display = 'none';
                examSection.style.display = 'block';
                // Show only review button in exam mode
                if (modeToggleContainer) {
                    modeToggleContainer.innerHTML = `<button class="mode-btn active" onclick="toggleViewMode('review')">← Back to Review</button>`;
                }
            }
        }

        function renderExamMode(q) {
            let examHtml = `
                <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
                    <h2 style="margin-bottom: 20px;">Question ${q.question_no}</h2>

                    <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <div style="font-weight: bold; margin-bottom: 10px;">Question:</div>
                        <div>${q.question_text}</div>
            `;

            // Show figure if available
            if (q.figure_image) {
                examHtml += `
                        <div style="margin-top: 15px;">
                            <img src="/${q.figure_image}" alt="Question figure" style="max-width: 100%; height: auto; border-radius: 4px;" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22400%22 height=%22300%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2216%22%3EImage not found%3C/text%3E%3C/svg%3E'">
                        </div>
                `;
            }

            examHtml += `
                    </div>

                    <div style="background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <div style="font-weight: bold; margin-bottom: 10px; color: #2e7d32;">Answer Key:</div>
                        <div style="font-size: 18px; color: #1b5e20; font-weight: bold;">${keyLabel(q.answer_key)}</div>
                    </div>

                    <div class="exam-answer-area">
                        <div style="font-weight: bold; margin-bottom: 15px;">Student Answer Input:</div>
            `;

            // Render based on question type
            if (q.type === 'NAT') {
                examHtml += renderNATInput(q);
            } else if (q.type === 'MCQ') {
                examHtml += renderMCQInput(q);
            } else if (q.type === 'MSQ') {
                examHtml += renderMSQInput(q);
            } else if (q.type === 'DESCRIPTIVE') {
                examHtml += renderDescriptiveInput(q);
            }

            examHtml += `
                    </div>

                    <div class="review-decision">
                        <div style="font-weight: bold; margin-bottom: 10px;">📊 Reviewer Decision:</div>
                        <div>
                            <label>
                                <input type="radio" name="marking_${q.id}" value="correct" onchange="studentMarking = 'correct'"> ✓ Mark as Correct
                            </label>
                            <label>
                                <input type="radio" name="marking_${q.id}" value="incorrect" onchange="studentMarking = 'incorrect'"> ✗ Mark as Incorrect
                            </label>
                            <label>
                                <input type="radio" name="marking_${q.id}" value="partial" onchange="studentMarking = 'partial'"> ⚠ Partial Credit
                            </label>
                        </div>
                    </div>
                </div>
            `;

            return examHtml;
        }

        function renderNATInput(q) {
            return `
                <div class="keypad-input">
                    <div class="keypad-display" id="natDisplay">0</div>
                    <div class="keypad">
                        <button class="keypad-btn" onclick="addNATDigit('7')">7</button>
                        <button class="keypad-btn" onclick="addNATDigit('8')">8</button>
                        <button class="keypad-btn" onclick="addNATDigit('9')">9</button>
                        <button class="keypad-btn" onclick="addNATDigit('4')">4</button>
                        <button class="keypad-btn" onclick="addNATDigit('5')">5</button>
                        <button class="keypad-btn" onclick="addNATDigit('6')">6</button>
                        <button class="keypad-btn" onclick="addNATDigit('1')">1</button>
                        <button class="keypad-btn" onclick="addNATDigit('2')">2</button>
                        <button class="keypad-btn" onclick="addNATDigit('3')">3</button>
                        <button class="keypad-btn" onclick="addNATDigit('0')">0</button>
                        <button class="keypad-btn" onclick="addNATDigit('.')">.</button>
                        <button class="keypad-btn delete" onclick="deleteNATDigit()">← Del</button>
                        <button class="keypad-btn clear" onclick="clearNAT()">Clear</button>
                    </div>
                    <div style="margin-top: 15px; text-align: center; color: #666;">Student will enter: <strong id="natValue">0</strong></div>
                </div>
            `;
        }

        function renderMCQInput(q) {
            return `
                <div class="options-grid">
                    ${q.options.map((opt, i) => `
                        <button class="option-btn" onclick="selectMCQ(this, '${String.fromCharCode(65 + i)}')">
                            <strong style="color: #3498db; margin-right: 10px;">${String.fromCharCode(65 + i)}:</strong> ${optText(opt)}
                        </button>
                    `).join('')}
                </div>
                <div style="text-align: center; color: #666;">Selected: <strong id="mcqValue">None</strong></div>
            `;
        }

        function renderMSQInput(q) {
            const options = q.answer_key.split('').filter(c => /[A-Z]/.test(c));
            return `
                <div class="options-grid">
                    ${['A', 'B', 'C', 'D'].map(opt => `
                        <button class="option-btn msq" onclick="toggleMSQ(this, '${opt}')">
                            <strong style="color: #3498db; margin-right: 10px;">${opt}:</strong> Option ${opt}
                        </button>
                    `).join('')}
                </div>
                <div style="text-align: center; color: #666;">Selected: <strong id="msqValue">None</strong></div>
            `;
        }

        function renderDescriptiveInput(q) {
            return `
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 10px; font-weight: bold;">Student Writing Area / Drawing Canvas:</label>
                    <div style="border: 2px dashed #999; padding: 20px; background: #fafafa; border-radius: 8px; text-align: center; color: #999; min-height: 250px;">
                        [Student would draw/write here in exam]<br><br>
                        <small>50 Marks | Drawing/Writing</small>
                    </div>
                </div>
                <div style="text-align: center; color: #666; margin-top: 15px;">
                    No auto-grading. Reviewer must evaluate the response.
                </div>
            `;
        }

        function addNATDigit(digit) {
            if (!studentAnswer) studentAnswer = '';
            if (digit === '.' && studentAnswer.includes('.')) return;
            if (studentAnswer === '0' && digit !== '.') studentAnswer = digit;
            else studentAnswer += digit;
            updateNATDisplay();
        }

        function deleteNATDigit() {
            if (studentAnswer) {
                studentAnswer = studentAnswer.slice(0, -1) || '0';
                updateNATDisplay();
            }
        }

        function clearNAT() {
            studentAnswer = '0';
            updateNATDisplay();
        }

        function updateNATDisplay() {
            document.getElementById('natDisplay').textContent = studentAnswer || '0';
            document.getElementById('natValue').textContent = studentAnswer || '0';
        }

        function selectMCQ(btn, option) {
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            studentAnswer = option;
            document.getElementById('mcqValue').textContent = option;
        }

        function toggleMSQ(btn, option) {
            btn.classList.toggle('selected');
            if (!studentAnswer) studentAnswer = '';
            if (btn.classList.contains('selected')) {
                if (!studentAnswer.includes(option)) studentAnswer += option;
            } else {
                studentAnswer = studentAnswer.replace(option, '');
            }
            studentAnswer = Array.from(studentAnswer).sort().join('');
            document.getElementById('msqValue').textContent = studentAnswer || 'None';
        }

        // Event listeners
        document.getElementById('examFilter').addEventListener('change', (e) => {
            currentFilters.exam = e.target.value;
            currentPage = 1;
            loadQuestions();
        });

        document.getElementById('typeFilter').addEventListener('change', (e) => {
            currentFilters.type = e.target.value;
            currentPage = 1;
            loadQuestions();
        });

        document.getElementById('statusFilter').addEventListener('change', (e) => {
            currentFilters.status = e.target.value;
            currentPage = 1;
            loadQuestions();
        });

        document.getElementById('reviewFilter').addEventListener('change', (e) => {
            currentFilters.review = e.target.value;
            currentPage = 1;
            loadQuestions();
        });

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentFilters.search = e.target.value;
                currentPage = 1;
                loadQuestions();
            }, 300);
        });

        // Start
        init();
    </script>
</body>
</html>
